[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yzipper-generator"
version = "0.1.0"
description = "Experimental Y-zipper-inspired STL generator for FDM calibration coupons."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "trimesh",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
yzipper = "yzipper.cli:main"

[tool.setuptools.packages.find]
include = ["yzipper*"]

